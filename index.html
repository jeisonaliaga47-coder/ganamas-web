function pickTopup(n,btn){document.getElementById('topupAmount').value=n.toFixed(2);document.querySelectorAll('.topup-choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected')}
function pickMethod(n,btn){document.getElementById('topupMethod').value=n;document.querySelectorAll('.topup-method').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected')}
async function requestTopup(){const amount=Number(document.getElementById('topupAmount')?.value),cents=Math.round(amount*100),method=document.getElementById('topupMethod')?.value,reference=document.getElementById('topupReference')?.value.trim();if(!Number.isFinite(amount)||cents<100||cents>10000000||!reference||reference.length<4)return message('Completa el monto y una referencia válida.',true);const r=await db.rpc('request_topup',{p_amount_cents:cents,p_method:method,p_reference:reference});if(r.error)return message(r.error.message,true);await load();message('Solicitud de recarga registrada. Pendiente de verificación.');render()}
async function reviewTopup(id,approve){if(!confirm(approve?'¿Comprobaste el ingreso real del pago? Se acreditarán créditos separados de las ganancias.':'¿Rechazar esta recarga?'))return;const r=await db.rpc('admin_review_topup',{p_id:id,p_approve:approve});if(r.error)return message(r.error.message,true);await load();message('Recarga revisada');render()}
async function adjustBalance(){const userId=document.getElementById('balanceUser')?.value,direction=document.getElementById('balanceDirection')?.value,amount=Number(document.getElementById('balanceAmount')?.value),reason=document.getElementById('balanceReason')?.value.trim(),cents=Math.round(amount*100)*(direction==='deduct'?-1:1);if(!userId||!Number.isFinite(amount)||amount<=0||Math.abs(cents)>10000000||reason.length<5)return message('Selecciona un usuario, monto válido y motivo de al menos 5 caracteres.',true);if(!confirm('¿Confirmas '+(cents>0?'AGREGAR ':'QUITAR ')+money(Math.abs(cents))+' al usuario seleccionado? Este movimiento quedará registrado.'))return;const r=await db.rpc('admin_adjust_balance',{p_user_id:userId,p_amount_cents:cents,p_reason:reason});if(r.error)return message(r.error.message,true);await load();message('Ajuste de saldo registrado');render()}
async function createTask(){const title=document.getElementById('taskTitle').value.trim(),description=document.getElementById('taskDescription').value.trim(),reward=Math.round(Number(document.getElementById('taskReward').value)*100);if(!title||!description||!Number.isSafeInteger(reward)||reward<1)return message('Completa título, instrucciones y recompensa válida.',true);const r=await db.rpc('admin_create_task',{p_title:title,p_description:description,p_reward_cents:reward});if(r.error)return message(r.error.message,true);await load();message('Tarea publicada');render()}
async function submitTask(id){if(!confirm('¿Confirmas que completaste la tarea?'))return;const r=await db.rpc('submit_task',{p_task_id:id});if(r.error)return message(r.error.message,true);await load();message('Tarea enviada a revisión');render()}
async function reviewTask(id,approve){if(!confirm(approve?'¿Verificaste la tarea? Se acreditará su recompensa.':'¿Rechazar esta entrega?'))return;const r=await db.rpc('admin_review_task',{p_submission_id:id,p_approve:approve});if(r.error)return message(r.error.message,true);await load();message(approve?'Tarea aprobada y acreditada':'Entrega rechazada');render()}
async function toggleTask(id,active){const r=await db.rpc('admin_toggle_task',{p_task_id:id,p_active:active});if(r.error)return message(r.error.message,true);await load();message('Estado actualizado');render()}
function setAuthMode(mode){authMode=mode;const signup=mode==='signup';const l=document.getElementById('loginTab'),r=document.getElementById('signupTab');if(!l||!r)return;l.classList.toggle('chosen',!signup);r.classList.toggle('chosen',signup);document.getElementById('confirmLabel').style.display=signup?'block':'none';document.getElementById('passwordConfirm').required=signup;document.getElementById('password').autocomplete=signup?'new-password':'current-password';document.getElementById('password').minLength=signup?10:6;document.getElementById('authSubmit').textContent=signup?'Crear cuenta':'Iniciar sesión';document.getElementById('forgotBtn').style.display=signup?'none':'block';document.querySelector('.login-title').textContent=signup?'Registrarse':'Iniciar sesión'}
function togglePassword(){const input=document.getElementById('password'),btn=document.getElementById('showPassword');input.type=input.type==='password'?'text':'password';btn.textContent=input.type==='password'?'Mostrar':'Ocultar'}
function accountCredentials(){const input=document.getElementById('account'),value=input.value.trim();if(legacyEmail){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))throw Error('Introduce un correo válido.');return {email:value}}const digits=value.replace(/\D/g,'');if(!/^9\d{8}$/.test(digits))throw Error('Introduce un celular peruano válido de 9 dígitos que comience con 9.');return {email:'pe51'+digits+'@phone.ganamas.example'}}
function toggleLegacy(){legacyEmail=!legacyEmail;const input=document.getElementById('account');input.value='';input.type=legacyEmail?'email':'tel';input.inputMode=legacyEmail?'email':'numeric';input.maxLength=legacyEmail?254:9;input.placeholder=legacyEmail?'Ingrese su correo electrónico':'Ingrese el número móvil';input.autocomplete=legacyEmail?'email':'tel-national';document.getElementById('accountLabel').textContent=legacyEmail?'CORREO ELECTRÓNICO':'NÚMERO DE TELÉFONO';document.getElementById('countryCode').style.display=legacyEmail?'none':'inline-flex';document.getElementById('legacySwitch').textContent=legacyEmail?'Registrarse o ingresar con número de teléfono':'¿Ya tienes una cuenta con correo? Ingresa aquí';message(legacyEmail?'Acceso para cuentas anteriores con correo.':'Acceso con número de celular y contraseña.')}
async function login(){let credentials;try{credentials=accountCredentials()}catch(e){return message(e.message,true)}const password=document.getElementById('password').value;const btn=document.getElementById('authSubmit');btn.disabled=true;btn.textContent='Ingresando...';try{const r=await db.auth.signInWithPassword({...credentials,password});if(r.error)return message(r.error.message,true);user=r.data.user;await load();message('Sesión iniciada');render()}catch(e){message('Error de conexión: '+e.message,true)}finally{const x=document.getElementById('authSubmit');if(x){x.disabled=false;x.textContent='Iniciar sesión'}}}
async function register(){if(legacyEmail)return message('Los nuevos registros se realizan con número de celular. Cambia a registro telefónico.',true);let credentials;try{credentials=accountCredentials()}catch(e){return message(e.message,true)}const password=document.getElementById('password').value;if(password.length<10)return message('Por seguridad, utiliza una contraseña de al menos 10 caracteres.',true);if(password.length>72)return message('La contraseña debe tener 72 caracteres o menos.',true);if(document.getElementById('passwordConfirm')?.value!==password)return message('Las contraseñas no coinciden.',true);const btn=document.getElementById('authSubmit');btn.disabled=true;btn.textContent='Creando cuenta...';try{const phone='+51'+document.getElementById('account').value.replace(/\D/g,'');const r=await db.functions.invoke('register-phone',{body:{phone,password}});if(r.error){let detail=r.data?.error;if(!detail&&r.error.context){try{const x=await r.error.context.json();detail=x.error}catch(e){}}return message(detail||r.error.message||'No se pudo crear la cuenta.',true)}if(!r.data?.ok)return message(r.data?.error||'El servidor no confirmó la creación de la cuenta.',true);const loginResult=await db.auth.signInWithPassword({...credentials,password});if(loginResult.error)return message('Cuenta creada. Inicia sesión con tu número y contraseña.',false);user=loginResult.data.user;await load();render();message('Cuenta creada y sesión iniciada.')}catch(e){message('No se pudo completar el registro: '+e.message,true)}finally{const x=document.getElementById('authSubmit');if(x){x.disabled=false;x.textContent='Crear cuenta'}}}
async function forgotPassword(){if(!legacyEmail)return message('Para recuperar una cuenta telefónica, contacta al soporte. No compartas tu contraseña.');const email=document.getElementById('account').value.trim();if(!email)return message('Escribe tu correo primero.',true);const r=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://ganamas-web.onrender.com'});if(r.error)return message(r.error.message,true);message('Si existe la cuenta, recibirás un enlace de recuperación por correo.')}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(()=>{const password=prompt('Introduce tu nueva contraseña (mínimo 6 caracteres):');if(!password)return;if(password.length<6){message('La contraseña debe tener al menos 6 caracteres.',true);return}db.auth.updateUser({password}).then(({error})=>{message(error?error.message:'Contraseña actualizada. Ya puedes iniciar sesión.',!!error)})},200)}});
function showActivation(){if(!user){message('Primero crea tu cuenta, confirma el correo e inicia sesión. Luego entra en Mi cuenta para activar el administrador.',true);return}setPage('Mi cuenta')}
async function claimAdmin(){const token=document.getElementById('adminToken')?.value.trim();if(!token)return message('Escribe el código privado de activación.',true);const r=await db.rpc('claim_first_admin',{p_token:token});if(r.error)return message(r.error.message,true);await load();page='Administración';message('Cuenta administradora activada');render()}
async function logout(){await db.auth.signOut();user=null;isAdmin=false;page='Inicio';render()}
async function requestWithdrawal(){const value=Number(document.getElementById('amount').value),cents=Math.round(value*100);if(!Number.isFinite(value)||cents<100)return message('Ingresa un monto válido de al menos S/1.',true);const r=await db.rpc('request_withdrawal',{p_amount_cents:cents});if(r.error)return message(r.error.message,true);await load();message('Solicitud registrada para revisión');render()}
async function review(id,status){let ref=null;if(status==='paid'){ref=prompt('Referencia del pago realmente realizado:');if(!ref||!ref.trim())return}if(!confirm(status==='paid'?'¿Confirmas que el pago se realizó realmente?':'¿Rechazar esta solicitud?'))return;const r=await db.rpc('admin_review_withdrawal',{p_id:id,p_status:status,p_reference:ref});if(r.error)return message(r.error.message,true);await load();message('Solicitud actualizada');render()}
init();
</script></body></html>
