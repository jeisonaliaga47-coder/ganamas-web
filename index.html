if(page==='Recargar')h+='<section class="card"><h2>Recargar créditos</h2><p class="muted">Los créditos se registran por separado de las ganancias y no son necesarios para acceder a tareas ni retirar ganancias.</p><div class="amount">'+money(records.topupCredits.filter(x=>x.user_id===user.id).reduce((a,x)=>a+x.amount_cents,0))+'</div><small>Créditos confirmados, no ganancias retirables</small><label>Monto de recarga (S/)<input id="topupAmount" type="number" min="1" step="0.01" placeholder="0.00"></label><label>Método de pago<select id="topupMethod" style="width:100%;padding:13px;background:#15152b;color:white;border:1px solid #534c74;border-radius:10px"><option>Yape</option><option>Plin</option><option>Transferencia</option></select></label><p class="muted">Este formulario no realiza el cobro. Usa solo los datos oficiales del negocio.</p><label>Referencia de operación<input id="topupReference" maxlength="100" placeholder="Número de operación"></label><button class="wide" onclick="requestTopup()">Enviar recarga para revisión</button></section><h2>Historial de recargas</h2>'+(records.topups.filter(x=>x.user_id===user.id).map(x=>'<section class="card row"><div><strong>'+money(x.amount_cents)+'</strong><br><small>'+esc(x.method)+' · '+esc(x.reference)+'</small></div><span class="tag">'+esc(x.status==='approved'?'Aprobada':x.status==='rejected'?'Rechazada':'Pendiente')+'</span></section>').join('')||'<p class="muted">Aún no tienes recargas.</p>');
if(page==='Retiros')h+='<img class="feature-image" src="assets/banner-retiros.svg" alt="Ilustración de consulta de saldos y retiros" loading="lazy">';
if(page==='Retiros')h+='<section class="card"><small>Saldo disponible</small><div class="amount">'+money(available)+'</div><label>Monto a solicitar (S/)<input id="amount" type="number" min="1" step="0.01" placeholder="0.00"></label><button class="wide" onclick="requestWithdrawal()">Solicitar retiro</button><p class="muted">Una solicitud no garantiza el pago. El administrador verificará y registrará la operación.</p></section><h2>Historial</h2>'+(records.withdrawals.map(x=>'<section class="card row"><span>'+money(x.amount_cents)+'<br><small>'+new Date(x.created_at).toLocaleDateString('es-PE')+'</small></span><span class="tag">'+esc(x.status)+'</span></section>').join('')||'<p class="muted">Sin solicitudes.</p>');
if(page==='Retiros')h+='<h2>Movimientos de saldo</h2>'+(records.ledger.map(x=>'<section class="card row"><span><strong>'+esc(x.kind==='earned'?'Recompensa verificada':x.kind==='adjustment'?'Ajuste administrativo':x.kind==='withdrawal'?'Retiro':'Reversión')+'</strong><br><small>'+esc(x.note||'Movimiento registrado')+'</small><br><small>'+new Date(x.created_at).toLocaleString('es-PE')+'</small></span><strong style="color:'+(x.amount_cents>=0?'#79e9c6':'#ff9eaa')+'">'+(x.amount_cents>0?'+':'')+money(x.amount_cents)+'</strong></section>').join('')||'<section class="card">Aún no hay movimientos.</section>');
if(page==='Mi cuenta')h+='<section class="card account-hero"><div class="avatar">✦</div><div><small>Mi cuenta</small><strong>'+esc(user.email)+'</strong><span class="tag">'+(isAdmin?'Administrador':'Usuario registrado')+'</span></div></section><section class="card"><small>Saldo disponible</small><div class="amount">'+money(available)+'</div><div class="grid"><button onclick="setPage(\'Retiros\')">Retirar</button><button class="secondary" onclick="setPage(\'Pedidos\')">Mis pedidos</button></div></section><h2>Centro de cuenta</h2><div class="account-actions"><button onclick="setPage(\'Tareas\')"><span>✦</span>Tomar un pedido</button><button onclick="setPage(\'Pedidos\')"><span>▤</span>Registro de pedidos</button><button onclick="setPage(\'Retiros\')"><span>⇄</span>Registro de retiros</button><button onclick="setPage(\'Retiros\')"><span>◈</span>Detalles de saldo</button><button onclick="setPage(\'Servicio\')"><span>☏</span>Servicio al cliente</button>'+(isAdmin?'<button onclick="setPage(\'Administración\')"><span>⚙</span>Administración</button>':'')+'</div><section class="card"><button class="secondary wide" onclick="logout()">Cerrar sesión</button></section>';
if(page==='Administración'&&isAdmin)h+='<section class="card"><h2>Panel administrador</h2><p>Usuarios registrados con perfil: '+records.profiles.length+'</p><p>Solicitudes de retiro: '+records.adminWithdrawals.length+'</p></section><h2>Solicitudes de retiro</h2>'+(records.adminWithdrawals.map(x=>'<section class="card"><strong>'+money(x.amount_cents)+'</strong> · '+esc(x.status)+'<p><small>Usuario: '+esc(x.user_id)+'</small></p>'+(x.status==='pending'?'<button onclick="review('+x.id+',\'paid\')">Registrar pago</button> <button class="secondary" onclick="review('+x.id+',\'rejected\')">Rechazar</button>':'')+'</section>').join('')||'<section class="card">No hay solicitudes.</section>');
if(page==='Administración'&&isAdmin)h+='<h2>Recargas pendientes</h2>'+(records.adminTopups.filter(x=>x.status==='pending').map(x=>'<section class="card"><strong>'+money(x.amount_cents)+'</strong><p class="muted">Usuario: '+esc(x.user_id)+'<br>Método: '+esc(x.method)+'<br>Referencia: '+esc(x.reference)+'</p><button onclick="reviewTopup('+x.id+',true)">Confirmar pago recibido</button> <button class="secondary" onclick="reviewTopup('+x.id+',false)">Rechazar</button></section>').join('')||'<p class="muted">No hay recargas pendientes.</p>');
if(page==='Administración'&&isAdmin){h+='<section class="card"><h2>Publicar tarea</h2><label>Título<input id="taskTitle" maxlength="120"></label><label>Instrucciones<input id="taskDescription" maxlength="1000"></label><label>Recompensa (S/)<input id="taskReward" type="number" min="0.01" step="0.01"></label><button class="wide" onclick="createTask()">Publicar tarea</button></section>';h+='<h2>Tareas publicadas</h2>'+(records.tasks.map(t=>'<section class="card row"><span>'+esc(t.title)+' · '+money(t.reward_cents)+' · '+(t.active?'Activa':'Inactiva')+'</span><button class="secondary" onclick="toggleTask('+t.id+','+(!t.active)+')">'+(t.active?'Desactivar':'Activar')+'</button></section>').join('')||'<p class="muted">Sin tareas.</p>');h+='<h2>Entregas pendientes</h2>'+(records.adminSubmissions.filter(x=>x.status==='pending').map(x=>'<section class="card"><strong>'+esc(records.tasks.find(t=>t.id===x.task_id)?.title||'Tarea #'+x.task_id)+'</strong><p class="muted">Usuario: '+esc(x.user_id)+'</p><button onclick="reviewTask('+x.id+',true)">Aprobar y acreditar</button> <button class="secondary" onclick="reviewTask('+x.id+',false)">Rechazar</button></section>').join('')||'<p class="muted">Sin entregas pendientes.</p>');h+='<section class="card"><h2>Gestión de saldos</h2><p class="muted">Ajustes administrativos registrados en el historial. No son comprobantes de pago.</p><label>Usuario<select id="balanceUser" style="width:100%;background:#15152b;border:1px solid #534c74;color:white;border-radius:10px;padding:12px;margin:7px 0 12px">'+records.profiles.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.display_name||p.id)+'</option>').join('')+'</select></label><label>Operación<select id="balanceDirection" style="width:100%;background:#15152b;border:1px solid #534c74;color:white;border-radius:10px;padding:12px;margin:7px 0 12px"><option value="add">Agregar saldo</option><option value="deduct">Quitar saldo</option></select></label><label>Monto (S/)<input id="balanceAmount" type="number" min="0.01" max="100000" step="0.01" placeholder="0.00"></label><label>Motivo del ajuste<input id="balanceReason" maxlength="500" placeholder="Explica por qué se modifica el saldo"></label><button class="wide" onclick="adjustBalance()">Guardar ajuste de saldo</button></section>';h+='<h2>Usuarios</h2>'+(records.profiles.map(p=>'<section class="card"><small>'+esc(p.id)+'</small> '+esc(p.display_name||'Usuario')+'</section>').join('')||'<p class="muted">Sin usuarios.</p>')}v.innerHTML=h}
async function requestTopup(){const amount=Number(document.getElementById('topupAmount')?.value),cents=Math.round(amount*100),method=document.getElementById('topupMethod')?.value,reference=document.getElementById('topupReference')?.value.trim();if(!Number.isFinite(amount)||cents<100||cents>10000000||!reference||reference.length<4)return message('Completa el monto y una referencia válida.',true);const r=await db.rpc('request_topup',{p_amount_cents:cents,p_method:method,p_reference:reference});if(r.error)return message(r.error.message,true);await load();message('Solicitud de recarga registrada. Pendiente de verificación.');render()}
async function reviewTopup(id,approve){if(!confirm(approve?'¿Comprobaste el ingreso real del pago? Se acreditarán créditos separados de las ganancias.':'¿Rechazar esta recarga?'))return;const r=await db.rpc('admin_review_topup',{p_id:id,p_approve:approve});if(r.error)return message(r.error.message,true);await load();message('Recarga revisada');render()}
async function adjustBalance(){const userId=document.getElementById('balanceUser')?.value,direction=document.getElementById('balanceDirection')?.value,amount=Number(document.getElementById('balanceAmount')?.value),reason=document.getElementById('balanceReason')?.value.trim(),cents=Math.round(amount*100)*(direction==='deduct'?-1:1);if(!userId||!Number.isFinite(amount)||amount<=0||Math.abs(cents)>10000000||reason.length<5)return message('Selecciona un usuario, monto válido y motivo de al menos 5 caracteres.',true);if(!confirm('¿Confirmas '+(cents>0?'AGREGAR ':'QUITAR ')+money(Math.abs(cents))+' al usuario seleccionado? Este movimiento quedará registrado.'))return;const r=await db.rpc('admin_adjust_balance',{p_user_id:userId,p_amount_cents:cents,p_reason:reason});if(r.error)return message(r.error.message,true);await load();message('Ajuste de saldo registrado');render()}
async function createTask(){const title=document.getElementById('taskTitle').value.trim(),description=document.getElementById('taskDescription').value.trim(),reward=Math.round(Number(document.getElementById('taskReward').value)*100);if(!title||!description||!Number.isSafeInteger(reward)||reward<1)return message('Completa título, instrucciones y recompensa válida.',true);const r=await db.rpc('admin_create_task',{p_title:title,p_description:description,p_reward_cents:reward});if(r.error)return message(r.error.message,true);await load();message('Tarea publicada');render()}
async function submitTask(id){if(!confirm('¿Confirmas que completaste la tarea?'))return;const r=await db.rpc('submit_task',{p_task_id:id});if(r.error)return message(r.error.message,true);await load();message('Tarea enviada a revisión');render()}
async function reviewTask(id,approve){if(!confirm(approve?'¿Verificaste la tarea? Se acreditará su recompensa.':'¿Rechazar esta entrega?'))return;const r=await db.rpc('admin_review_task',{p_submission_id:id,p_approve:approve});if(r.error)return message(r.error.message,true);await load();message(approve?'Tarea aprobada y acreditada':'Entrega rechazada');render()}
async function toggleTask(id,active){const r=await db.rpc('admin_toggle_task',{p_task_id:id,p_active:active});if(r.error)return message(r.error.message,true);await load();message('Estado actualizado');render()}
function setAuthMode(mode){authMode=mode;const signup=mode==='signup';const l=document.getElementById('loginTab'),r=document.getElementById('signupTab');if(!l||!r)return;l.classList.toggle('chosen',!signup);r.classList.toggle('chosen',signup);document.getElementById('authTitle').textContent=signup?'Crear una cuenta':'Bienvenido de nuevo';document.getElementById('authSubtitle').textContent=signup?'Regístrate para comenzar':'Ingresa con tu cuenta para continuar';document.getElementById('confirmLabel').style.display=signup?'block':'none';document.getElementById('passwordConfirm').required=signup;document.getElementById('password').autocomplete=signup?'new-password':'current-password';document.getElementById('authSubmit').textContent=signup?'Crear cuenta':'Iniciar sesión';document.getElementById('forgotBtn').style.display=signup?'none':'block'}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const r=await db.auth.signInWithPassword({email,password});if(r.error)return message(r.error.message,true);user=r.data.user;await load();message('Sesión iniciada');render()}
async function register(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return message('Introduce correo y contraseña de al menos 6 caracteres.',true);const confirmation=document.getElementById('passwordConfirm')?.value;if(confirmation!==undefined&&password!==confirmation)return message('Las contraseñas no coinciden.',true);const btn=document.getElementById('authSubmit');if(btn){btn.disabled=true;btn.textContent='Creando cuenta...'}try{const r=await db.auth.signUp({email,password});if(r.error){const detail=r.error.message||'Error desconocido';return message(detail.toLowerCase().includes('rate limit')?'El servicio de correo alcanzó temporalmente su límite. Intenta más tarde o configura la confirmación por correo en Supabase.':detail,true)}if(!r.data.user)return message('El servidor no confirmó la creación de la cuenta.',true);message(r.data.session?'Cuenta creada y sesión iniciada.':'Registro recibido. Si Supabase requiere confirmación, revisa tu correo.');if(r.data.session){user=r.data.user;await load();render()}}catch(e){message('No se pudo conectar con el servicio de registro: '+(e.message||'Error de red'),true)}finally{const b=document.getElementById('authSubmit');if(b){b.disabled=false;b.textContent='Crear cuenta'}}}
async function forgotPassword(){const email=document.getElementById('email').value.trim();if(!email)return message('Escribe tu correo electrónico primero.',true);const r=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://ganamas-web.onrender.com'});if(r.error)return message(r.error.message,true);message('Si el correo está registrado, recibirás un enlace para restablecer la contraseña. Revisa también spam.')}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(()=>{const password=prompt('Introduce tu nueva contraseña (mínimo 6 caracteres):');if(!password)return;if(password.length<6){message('La contraseña debe tener al menos 6 caracteres.',true);return}db.auth.updateUser({password}).then(({error})=>{message(error?error.message:'Contraseña actualizada. Ya puedes iniciar sesión.',!!error)})},200)}});
function showActivation(){if(!user){message('Primero crea tu cuenta, confirma el correo e inicia sesión. Luego entra en Mi cuenta para activar el administrador.',true);return}setPage('Mi cuenta')}
async function claimAdmin(){const token=document.getElementById('adminToken')?.value.trim();if(!token)return message('Escribe el código privado de activación.',true);const r=await db.rpc('claim_first_admin',{p_token:token});if(r.error)return message(r.error.message,true);await load();page='Administración';message('Cuenta administradora activada');render()}
async function logout(){await db.auth.signOut();user=null;isAdmin=false;page='Inicio';render()}
async function requestWithdrawal(){const value=Number(document.getElementById('amount').value),cents=Math.round(value*100);if(!Number.isFinite(value)||cents<100)return message('Ingresa un monto válido de al menos S/1.',true);const r=await db.rpc('request_withdrawal',{p_amount_cents:cents});if(r.error)return message(r.error.message,true);await load();message('Solicitud registrada para revisión');render()}
async function review(id,status){let ref=null;if(status==='paid'){ref=prompt('Referencia del pago realmente realizado:');if(!ref||!ref.trim())return}if(!confirm(status==='paid'?'¿Confirmas que el pago se realizó realmente?':'¿Rechazar esta solicitud?'))return;const r=await db.rpc('admin_review_withdrawal',{p_id:id,p_status:status,p_reference:ref});if(r.error)return message(r.error.message,true);await load();message('Solicitud actualizada');render()}
init();
</script></body></html>
