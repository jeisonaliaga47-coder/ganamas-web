<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GanaMás | Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#101021;color:#f7f6ff;font:15px system-ui,Arial}.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 18px 95px;background:linear-gradient(160deg,#25144d,#111125 45%)}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:14px 0}small,.muted{color:#b8b5cf}.pill{border-radius:20px;background:#392568;padding:8px 14px}.card{background:#25223d;border:1px solid #403a63;border-radius:19px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #08081644}.hero{background:linear-gradient(120deg,#6940d2,#257ba4)}.balance{font-size:33px;font-weight:800;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}button{cursor:pointer;background:#7353e8;color:white;border:0;border-radius:12px;padding:13px;font-weight:700}button.secondary{background:#363451}button:disabled{opacity:.5}.wide{width:100%;margin-top:10px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#1e1b35;display:flex;justify-content:space-around;padding:12px 4px;border-top:1px solid #403a63}nav button{font-size:11px;padding:9px 5px;background:transparent}nav button.active{color:#5cdef4}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;background:#164c50;color:#82f6e8;padding:6px;border-radius:9px}input{width:100%;background:#141429;color:white;border:1px solid #514a75;padding:12px;border-radius:10px;margin:7px 0}label{display:block;margin-top:10px}.notice{font-size:12px;background:#43331e;border-radius:10px;padding:12px;color:#ffe3a2}.hidden{display:none}</style></head><body><div class="app"><header><strong>✦ GanaMás</strong><span class="pill">VIP 0 · DEMO</span></header><div class="notice" style="margin-top:15px">Sitio de demostración. Los importes son ficticios; no se realizan pagos, recargas ni retiros reales.</div><main id="view"></main></div><nav id="nav"></nav><script>const pages=['Inicio','Pedidos','Tomar pedido','Retiros','Mi cuenta'];let page='Inicio',completed=JSON.parse(localStorage.getItem('demoDone')||'[]');const tasks=[{id:1,title:'Revisar catálogo de productos',reward:2.5},{id:2,title:'Evaluar una ficha de producto',reward:3},{id:3,title:'Responder encuesta de experiencia',reward:1.5}];function money(n){return 'S/ '+n.toFixed(2)}function setPage(p){page=p;render()}function render(){document.getElementById('nav').innerHTML=pages.map((p,i)=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+['⌂','▤','◎','⇄','◉'][i]+'<br>'+p+'</button>').join('');let earned=tasks.filter(t=>completed.includes(t.id)).reduce((a,t)=>a+t.reward,0);let h='<h1>'+page+'</h1>';if(page==='Inicio')h+='<section class="card hero"><small>Saldo de demostración</small><div class="balance">'+money(earned)+'</div><small>Ganancias simuladas · no retirables</small></section><div class="grid"><div class="card"><small>Tareas completas</small><h2>'+completed.length+'</h2></div><div class="card"><small>Tareas disponibles</small><h2>'+(tasks.length-completed.length)+'</h2></div></div><section class="card"><h3>Bienvenido a GanaMás</h3><p>Explora tareas de ejemplo y conoce cómo funciona la plataforma.</p><button class="wide" onclick="setPage(\'Tomar pedido\')">Ver tareas</button></section>';if(page==='Pedidos'||page==='Tomar pedido')h+=tasks.map(t=>'<section class="card"><div class="row"><strong>'+t.title+'</strong><span class="tag">'+money(t.reward)+'</span></div><p class="muted">Actividad de prueba · sin comisión real</p><button '+(completed.includes(t.id)?'disabled':'')+' onclick="complete('+t.id+')">'+(completed.includes(t.id)?'Completada':'Completar demostración')+'</button></section>').join('');if(page==='Retiros')h+='<section class="card"><small>Saldo de demostración</small><div class="balance">'+money(earned)+'</div><p>Los retiros reales no están habilitados.</p><button disabled class="wide">Solicitar retiro</button></section><section class="card">Historial de retiros: sin movimientos reales.</section>';if(page==='Mi cuenta')h+='<section class="card"><h3>Perfil de demostración</h3><label>Nombre<input id="name" placeholder="Tu nombre" value="'+(localStorage.getItem('demoName')||'')+'"></label><button class="wide" onclick="saveName()">Guardar nombre</button></section><section class="card"><strong>Nivel VIP 0</strong><p class="muted">Indicador visual de demostración; no requiere pagos.</p></section><button class="secondary wide" onclick="reset()">Reiniciar demostración</button>';document.getElementById('view').innerHTML=h}function complete(id){if(!completed.includes(id)){completed.push(id);localStorage.setItem('demoDone',JSON.stringify(completed));render()}}function saveName(){localStorage.setItem('demoName',document.getElementById('name').value);alert('Nombre guardado en este dispositivo')}function reset(){localStorage.removeItem('demoDone');completed=[];setPage('Inicio')}render();</script></body></html>
