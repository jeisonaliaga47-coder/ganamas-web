<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GanaMás</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0f1023;color:#f8f7ff;font:15px system-ui,Arial}.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 17px 100px;background:linear-gradient(155deg,#2d1857,#111126 48%)}header,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:22px 0 14px}h2{font-size:20px}.muted,small{color:#bdb9d2}.card{background:#25223e;border:1px solid #413b63;border-radius:18px;padding:17px;margin:13px 0}.hero{background:linear-gradient(125deg,#6b45c9,#266c97)}.amount{font-size:34px;font-weight:800;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}button{background:#7655e9;color:#fff;border:0;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.wide{width:100%}.secondary{background:#393653}input{width:100%;background:#15152b;border:1px solid #534c74;color:white;border-radius:10px;padding:12px;margin:7px 0 12px}label{display:block;margin-top:9px}.notice{background:#43331d;color:#ffe0a0;padding:12px;border-radius:11px;font-size:12px;margin:15px 0}.tag{background:#164f4e;color:#80f2d8;border-radius:9px;padding:5px;font-size:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#1d1b35;display:flex;justify-content:space-around;padding:11px 3px;border-top:1px solid #453d68}nav button{background:transparent;font-size:11px;padding:8px 3px}nav button.active{color:#7ce6ef}.error{color:#ffb1ad}.success{color:#8debc1}#message{min-height:20px;font-size:13px}a{color:#b4a0ff}</style></head><body><div class="app"><header><strong>✦ GanaMás</strong><span class="tag" id="identity">Cuenta segura</span></header><div id="message"></div><main id="view"></main></div><nav id="nav"></nav><script>
const db=supabase.createClient('https://nyifxelbhfvwewpabbzs.supabase.co','sb_publishable_zkTB-Ln63UM9TvhMEUyjcg_H0gklNiJ');
let user=null,page='Inicio',isAdmin=false,records={tasks:[],submissions:[],ledger:[],withdrawals:[],adminWithdrawals:[],adminSubmissions:[],profiles:[]};
const pages=['Inicio','Tareas','Retiros','Mi cuenta','Administración'];
const money=n=>'S/ '+(n/100).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(s,error=false){document.getElementById('message').innerHTML='<p class="'+(error?'error':'success')+'">'+esc(s)+'</p>'}
function setPage(p){page=p;render()}
async function init(){const r=await db.auth.getUser();user=r.data.user;await load();render()}
async function load(){if(!user)return;const a=await db.from('admin_members').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!a.data;const [t,s,l,w]=await Promise.all([db.from('tasks').select('*').order('id'),db.from('task_submissions').select('*').order('created_at',{ascending:false}),db.from('ledger').select('*').order('created_at',{ascending:false}),db.from('withdrawal_requests').select('*').order('created_at',{ascending:false})]);records.tasks=t.data||[];records.submissions=s.data||[];records.ledger=l.data||[];records.withdrawals=w.data||[];if(isAdmin){const [aw,pr,as]=await Promise.all([db.from('withdrawal_requests').select('*').order('created_at',{ascending:false}),db.from('profiles').select('*'),db.from('task_submissions').select('*').order('created_at',{ascending:false})]);records.adminWithdrawals=aw.data||[];records.profiles=pr.data||[];records.adminSubmissions=as.data||[]}}
function render(){document.getElementById('identity').textContent=user?(isAdmin?'Administrador':'Usuario'):'Acceso';document.getElementById('nav').innerHTML=user?pages.filter(p=>p!=='Administración'||isAdmin).map((p,i)=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+['⌂','▤','⇄','◉','⚙'][i]+'<br>'+p+'</button>').join(''):'';let v=document.getElementById('view');if(!user){v.innerHTML='<h1>Bienvenido a GanaMás</h1><section class="card"><h2>Acceso a tu cuenta</h2><form id="authForm"><label>Correo electrónico<input id="email" type="email" autocomplete="email" required></label><label>Contraseña<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button class="wide" type="submit">Iniciar sesión</button><button class="wide secondary" type="button" onclick="register()">Crear cuenta</button><button class="wide secondary" type="button" onclick="forgotPassword()">Olvidé mi contraseña</button></form></section><div class="notice">Las ganancias dependen de tareas realmente verificadas. No se requieren depósitos para liberar retiros.</div>';document.getElementById('authForm').onsubmit=e=>{e.preventDefault();login()};return}
const earned=records.ledger.reduce((a,x)=>a+x.amount_cents,0),reserved=records.withdrawals.filter(x=>['pending','approved'].includes(x.status)).reduce((a,x)=>a+x.amount_cents,0),available=Math.max(0,earned-reserved);let h='<h1>'+esc(page)+'</h1>';
if(page==='Inicio')h+='<section class="card hero"><small>Saldo registrado</small><div class="amount">'+money(earned)+'</div><small>Disponible para solicitar: '+money(available)+'</small></section><div class="grid"><div class="card"><small>Tareas</small><h2>'+records.tasks.length+'</h2></div><div class="card"><small>Retiros pendientes</small><h2>'+records.withdrawals.filter(x=>x.status==='pending').length+'</h2></div></div><section class="card"><h2>Tu actividad</h2><p class="muted">Las comisiones solo se acreditan después de su verificación.</p><button onclick="setPage(\'Tareas\')">Ver tareas</button></section>';
if(page==='Tareas')h+=records.tasks.length?records.tasks.map(t=>'<section class="card"><div class="row"><strong>'+esc(t.title)+'</strong><span class="tag">'+money(t.reward_cents)+'</span></div><p class="muted">'+esc(t.description||'Tarea disponible')+'</p>'+(records.submissions.some(x=>x.task_id===t.id)?'<small>Estado: '+esc(records.submissions.find(x=>x.task_id===t.id).status)+'</small>':'<button onclick="submitTask('+t.id+')">Enviar tarea para revisión</button>')+'</section>').join(''):'<section class="card">Todavía no hay tareas activas. El administrador debe publicar las primeras.</section>';
if(page==='Retiros')h+='<section class="card"><small>Saldo disponible</small><div class="amount">'+money(available)+'</div><label>Monto a solicitar (S/)<input id="amount" type="number" min="1" step="0.01" placeholder="0.00"></label><button class="wide" onclick="requestWithdrawal()">Solicitar retiro</button><p class="muted">Una solicitud no garantiza el pago. El administrador verificará y registrará la operación.</p></section><h2>Historial</h2>'+(records.withdrawals.map(x=>'<section class="card row"><span>'+money(x.amount_cents)+'<br><small>'+new Date(x.created_at).toLocaleDateString('es-PE')+'</small></span><span class="tag">'+esc(x.status)+'</span></section>').join('')||'<p class="muted">Sin solicitudes.</p>');
if(page==='Mi cuenta')h+='<section class="card"><p><strong>'+esc(user.email)+'</strong></p><p class="muted">Cuenta verificada mediante Supabase Auth.</p><button class="secondary wide" onclick="logout()">Cerrar sesión</button></section>';
if(page==='Administración'&&isAdmin)h+='<section class="card"><h2>Panel administrador</h2><p>Usuarios registrados con perfil: '+records.profiles.length+'</p><p>Solicitudes de retiro: '+records.adminWithdrawals.length+'</p></section><h2>Solicitudes de retiro</h2>'+(records.adminWithdrawals.map(x=>'<section class="card"><strong>'+money(x.amount_cents)+'</strong> · '+esc(x.status)+'<p><small>Usuario: '+esc(x.user_id)+'</small></p>'+(x.status==='pending'?'<button onclick="review('+x.id+',\'paid\')">Registrar pago</button> <button class="secondary" onclick="review('+x.id+',\'rejected\')">Rechazar</button>':'')+'</section>').join('')||'<section class="card">No hay solicitudes.</section>');
if(page==='Administración'&&isAdmin){h+='<section class="card"><h2>Publicar tarea</h2><label>Título<input id="taskTitle" maxlength="120"></label><label>Instrucciones<input id="taskDescription" maxlength="1000"></label><label>Recompensa (S/)<input id="taskReward" type="number" min="0.01" step="0.01"></label><button class="wide" onclick="createTask()">Publicar tarea</button></section>';h+='<h2>Tareas publicadas</h2>'+(records.tasks.map(t=>'<section class="card row"><span>'+esc(t.title)+' · '+money(t.reward_cents)+' · '+(t.active?'Activa':'Inactiva')+'</span><button class="secondary" onclick="toggleTask('+t.id+','+(!t.active)+')">'+(t.active?'Desactivar':'Activar')+'</button></section>').join('')||'<p class="muted">Sin tareas.</p>');h+='<h2>Entregas pendientes</h2>'+(records.adminSubmissions.filter(x=>x.status==='pending').map(x=>'<section class="card"><strong>'+esc(records.tasks.find(t=>t.id===x.task_id)?.title||'Tarea #'+x.task_id)+'</strong><p class="muted">Usuario: '+esc(x.user_id)+'</p><button onclick="reviewTask('+x.id+',true)">Aprobar y acreditar</button> <button class="secondary" onclick="reviewTask('+x.id+',false)">Rechazar</button></section>').join('')||'<p class="muted">Sin entregas pendientes.</p>');h+='<h2>Usuarios</h2>'+(records.profiles.map(p=>'<section class="card"><small>'+esc(p.id)+'</small> '+esc(p.display_name||'Usuario')+'</section>').join('')||'<p class="muted">Sin usuarios.</p>')}v.innerHTML=h}
async function createTask(){const title=document.getElementById('taskTitle').value.trim(),description=document.getElementById('taskDescription').value.trim(),reward=Math.round(Number(document.getElementById('taskReward').value)*100);if(!title||!description||!Number.isSafeInteger(reward)||reward<1)return message('Completa título, instrucciones y recompensa válida.',true);const r=await db.rpc('admin_create_task',{p_title:title,p_description:description,p_reward_cents:reward});if(r.error)return message(r.error.message,true);await load();message('Tarea publicada');render()}
async function submitTask(id){if(!confirm('¿Confirmas que completaste la tarea?'))return;const r=await db.rpc('submit_task',{p_task_id:id});if(r.error)return message(r.error.message,true);await load();message('Tarea enviada a revisión');render()}
async function reviewTask(id,approve){if(!confirm(approve?'¿Verificaste la tarea? Se acreditará su recompensa.':'¿Rechazar esta entrega?'))return;const r=await db.rpc('admin_review_task',{p_submission_id:id,p_approve:approve});if(r.error)return message(r.error.message,true);await load();message(approve?'Tarea aprobada y acreditada':'Entrega rechazada');render()}
async function toggleTask(id,active){const r=await db.rpc('admin_toggle_task',{p_task_id:id,p_active:active});if(r.error)return message(r.error.message,true);await load();message('Estado actualizado');render()}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const r=await db.auth.signInWithPassword({email,password});if(r.error)return message(r.error.message,true);user=r.data.user;await load();message('Sesión iniciada');render()}
async function register(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return message('Introduce correo y contraseña de al menos 6 caracteres.',true);const r=await db.auth.signUp({email,password});if(r.error)return message(r.error.message.toLowerCase().includes('rate limit')?'El servicio de correo alcanzó temporalmente su límite. Espera antes de intentar registrarte de nuevo.':r.error.message,true);message(r.data.session?'Cuenta creada y sesión iniciada.':'Solicitud de registro recibida. Si se requiere confirmación, revisa tu correo.');if(r.data.session){user=r.data.user;await load();render()}}
async function forgotPassword(){const email=document.getElementById('email').value.trim();if(!email)return message('Escribe tu correo electrónico primero.',true);const r=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://ganamas-web.onrender.com'});if(r.error)return message(r.error.message,true);message('Si el correo está registrado, recibirás un enlace para restablecer la contraseña. Revisa también spam.')}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(()=>{const password=prompt('Introduce tu nueva contraseña (mínimo 6 caracteres):');if(!password)return;if(password.length<6){message('La contraseña debe tener al menos 6 caracteres.',true);return}db.auth.updateUser({password}).then(({error})=>{message(error?error.message:'Contraseña actualizada. Ya puedes iniciar sesión.',!!error)})},200)}});
function showActivation(){if(!user){message('Primero crea tu cuenta, confirma el correo e inicia sesión. Luego entra en Mi cuenta para activar el administrador.',true);return}setPage('Mi cuenta')}
async function claimAdmin(){const token=document.getElementById('adminToken')?.value.trim();if(!token)return message('Escribe el código privado de activación.',true);const r=await db.rpc('claim_first_admin',{p_token:token});if(r.error)return message(r.error.message,true);await load();page='Administración';message('Cuenta administradora activada');render()}
async function logout(){await db.auth.signOut();user=null;isAdmin=false;page='Inicio';render()}
async function requestWithdrawal(){const value=Number(document.getElementById('amount').value),cents=Math.round(value*100);if(!Number.isFinite(value)||cents<100)return message('Ingresa un monto válido de al menos S/1.',true);const r=await db.rpc('request_withdrawal',{p_amount_cents:cents});if(r.error)return message(r.error.message,true);await load();message('Solicitud registrada para revisión');render()}
async function review(id,status){let ref=null;if(status==='paid'){ref=prompt('Referencia del pago realmente realizado:');if(!ref||!ref.trim())return}if(!confirm(status==='paid'?'¿Confirmas que el pago se realizó realmente?':'¿Rechazar esta solicitud?'))return;const r=await db.rpc('admin_review_withdrawal',{p_id:id,p_status:status,p_reference:ref});if(r.error)return message(r.error.message,true);await load();message('Solicitud actualizada');render()}
init();
</script></body></html>
