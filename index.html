<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GanaMás</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0f1023;color:#f8f7ff;font:15px system-ui,Arial}.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 17px 100px;background:linear-gradient(155deg,#2d1857,#111126 48%)}header,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:22px 0 14px}h2{font-size:20px}.muted,small{color:#bdb9d2}.card{background:#25223e;border:1px solid #413b63;border-radius:18px;padding:17px;margin:13px 0}.hero{background:linear-gradient(125deg,#6b45c9,#266c97)}.amount{font-size:34px;font-weight:800;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}button{background:#7655e9;color:#fff;border:0;border-radius:11px;padding:12px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.wide{width:100%}.secondary{background:#393653}input{width:100%;background:#15152b;border:1px solid #534c74;color:white;border-radius:10px;padding:12px;margin:7px 0 12px}label{display:block;margin-top:9px}.notice{background:#43331d;color:#ffe0a0;padding:12px;border-radius:11px;font-size:12px;margin:15px 0}.tag{background:#164f4e;color:#80f2d8;border-radius:9px;padding:5px;font-size:12px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#1d1b35;display:flex;justify-content:space-around;padding:11px 3px;border-top:1px solid #453d68}nav button{background:transparent;font-size:11px;padding:8px 3px}nav button.active{color:#7ce6ef}.error{color:#ffb1ad}.success{color:#8debc1}#message{min-height:20px;font-size:13px}a{color:#b4a0ff}</style><style>body{background:#080b19;color:#f7f7ff}.app{background:radial-gradient(ellipse at 100% 0%,#41142f,transparent 40%),linear-gradient(165deg,#121329,#080c1b 65%)}header strong{font-size:22px}.card{background:linear-gradient(145deg,#1a1d36,#101427);border:1px solid #292d4b;border-radius:20px;box-shadow:0 8px 24px #0002}.hero{background:linear-gradient(120deg,#192f49,#39214d)}.tag{background:#124d58;color:#71f8ed}.muted,small{color:#a5aac7}button{background:linear-gradient(100deg,#1de2d9,#88e7de);color:#0b1830;border-radius:13px}button.secondary{background:#23283e;color:#fff}nav{background:#0e1427;border-radius:25px 25px 0 0;border:1px solid #29304b;padding:12px 3px 17px}nav button{color:#9ca8c7;flex:1}nav button.active{background:#205c67;color:#8df7ed}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:75px;background:linear-gradient(145deg,#1b2441,#11172b);color:#eef3ff;border:1px solid #293452}.banner{padding:17px;border-radius:18px;background:linear-gradient(105deg,#1ee5dc,#95f0e9);color:#08192c;font-weight:800;width:100%;margin:12px 0}.vip{background:linear-gradient(115deg,#303d68,#5d679e);border-radius:19px;padding:18px;margin:12px 0}</style><style>.card .row{align-items:flex-start}.card .row strong{overflow-wrap:anywhere}.card small{overflow-wrap:anywhere}.card button{margin:3px 0}.app{padding-bottom:125px}.quick button{font-size:13px}.quick button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #65e8e5;outline-offset:2px}@media(max-width:370px){nav button{font-size:9px}.amount{font-size:29px}.card{padding:14px}}.card p{line-height:1.5}</style><style>
.auth-brand{text-align:center;padding:38px 0 26px}.auth-logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(140deg,#42e9e3,#7849e8);color:#0b1930;font-size:43px;font-weight:900;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 12px 45px #3ddbdc3b}.auth-brand h1{font-size:34px;margin:0;letter-spacing:-1px}.auth-brand p{color:#9aa7c8;margin-top:8px}.auth-card{background:linear-gradient(145deg,#1c1c38,#121529);border:1px solid #393153;border-radius:23px;padding:20px 19px 24px;box-shadow:0 20px 60px #0005}.auth-card h2{margin:24px 0 6px}.auth-card p{margin:0 0 20px}.auth-card label{font-size:13px;color:#d6d8ed;font-weight:600}.auth-card input{height:49px;border-radius:12px;background:#101327;border:1px solid #3e405d}.auth-tabs{display:flex;background:#0d1125;padding:5px;border-radius:14px;gap:5px}.auth-tabs button{width:50%;background:transparent;color:#a9a9c3;border-radius:10px;padding:12px 5px}.auth-tabs button.chosen{background:linear-gradient(100deg,#27c8d1,#5ce7dc);color:#071728}.auth-submit{margin-top:16px;padding:15px}.text-button{display:block;background:transparent;color:#70e8e8;width:100%;padding:17px 0 0}.auth-footer{text-align:center;color:#8f9db9;font-size:12px;line-height:1.6;padding:15px 14px}.auth-card input:focus{outline:2px solid #50dcd9;outline-offset:1px}
</style></head><body><div class="app"><header><strong>✦ GanaMás</strong><span class="tag" id="identity">Cuenta segura</span></header><div id="message"></div><main id="view"></main></div><nav id="nav"></nav><script>
const db=supabase.createClient('https://nyifxelbhfvwewpabbzs.supabase.co','sb_publishable_zkTB-Ln63UM9TvhMEUyjcg_H0gklNiJ');
let user=null,page='Inicio',isAdmin=false,authMode='login',records={tasks:[],submissions:[],ledger:[],withdrawals:[],adminWithdrawals:[],adminSubmissions:[],profiles:[]};
const pages=['Inicio','Tareas','Retiros','Mi cuenta','Administración'];
const money=n=>'S/ '+(n/100).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(s,error=false){document.getElementById('message').innerHTML='<p class="'+(error?'error':'success')+'">'+esc(s)+'</p>'}
function setPage(p){page=p;render()}
async function init(){const r=await db.auth.getUser();user=r.data.user;await load();render()}
async function load(){if(!user)return;const a=await db.from('admin_members').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!a.data;const [t,s,l,w]=await Promise.all([db.from('tasks').select('*').order('id'),db.from('task_submissions').select('*').order('created_at',{ascending:false}),db.from('ledger').select('*').order('created_at',{ascending:false}),db.from('withdrawal_requests').select('*').order('created_at',{ascending:false})]);records.tasks=t.data||[];records.submissions=s.data||[];records.ledger=l.data||[];records.withdrawals=w.data||[];if(isAdmin){const [aw,pr,as]=await Promise.all([db.from('withdrawal_requests').select('*').order('created_at',{ascending:false}),db.from('profiles').select('*'),db.from('task_submissions').select('*').order('created_at',{ascending:false})]);records.adminWithdrawals=aw.data||[];records.profiles=pr.data||[];records.adminSubmissions=as.data||[]}}
function render(){document.getElementById('identity').textContent=user?(isAdmin?'Administrador':'Usuario'):'Acceso';document.getElementById('nav').innerHTML=user?pages.filter(p=>p!=='Administración'||isAdmin).map((p,i)=>'<button class="'+(page===p?'active':'')+'" onclick="setPage(\''+p+'\')">'+['⌂','▤','⇄','◉','⚙'][i]+'<br>'+p+'</button>').join(''):'';let v=document.getElementById('view');if(!user){v.innerHTML='<div class="auth-brand"><div class="auth-logo">✦</div><h1>GanaMás</h1><p>Tu espacio de tareas y recompensas</p></div><section class="auth-card"><div class="auth-tabs"><button id="loginTab" class="chosen" type="button" onclick="setAuthMode(\'login\')">Iniciar sesión</button><button id="signupTab" type="button" onclick="setAuthMode(\'signup\')">Registrarse</button></div><h2 id="authTitle">Bienvenido de nuevo</h2><p id="authSubtitle" class="muted">Ingresa con tu cuenta para continuar</p><form id="authForm"><label>Correo electrónico<input id="email" type="email" autocomplete="email" placeholder="ejemplo@correo.com" required></label><label>Contraseña<input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres" required></label><label id="confirmLabel" style="display:none">Confirmar contraseña<input id="passwordConfirm" type="password" minlength="6" autocomplete="new-password" placeholder="Repite tu contraseña"></label><button class="wide auth-submit" id="authSubmit" type="submit">Iniciar sesión</button><button class="text-button" id="forgotBtn" type="button" onclick="forgotPassword()">¿Olvidaste tu contraseña?</button></form></section><p class="auth-footer">Las recompensas se acreditan después de verificar las tareas. No necesitas depositar dinero para retirar.</p>';document.getElementById('authForm').onsubmit=e=>{e.preventDefault();authMode==='signup'?register():login()};setAuthMode(authMode);return}
const earned=records.ledger.reduce((a,x)=>a+x.amount_cents,0),reserved=records.withdrawals.filter(x=>['pending','approved'].includes(x.status)).reduce((a,x)=>a+x.amount_cents,0),available=Math.max(0,earned-reserved);let h='<h1>'+esc(page)+'</h1>';
if(page==='Inicio')h+='<section class="card hero"><small>Saldo registrado</small><div class="amount">'+money(earned)+'</div><small>Disponible para solicitar: '+money(available)+'</small></section><div class="grid"><div class="card"><small>Tareas</small><h2>'+records.tasks.length+'</h2></div><div class="card"><small>Retiros pendientes</small><h2>'+records.withdrawals.filter(x=>x.status==='pending').length+'</h2></div></div><section class="card"><h2>Tu actividad</h2><p class="muted">Las comisiones solo se acreditan después de su verificación.</p><button onclick="setPage(\'Tareas\')">Ver tareas</button></section>';
if(page==='Inicio')h+='<button class="banner" onclick="setPage(\'Tareas\')">⚡ Comenzar a ganar dinero</button><h2>Acceso rápido</h2><div class="quick"><button onclick="setPage(\'Retiros\')">◈ Saldo y retiros</button><button onclick="setPage(\'Retiros\')">▣ Solicitar retiro</button><button onclick="setPage(\'Tareas\')">✦ Mis tareas</button><button onclick="setPage(\'Mi cuenta\')">☻ Mi cuenta</button></div><h2>Mi membresía</h2><div class="vip"><strong>VIP 1 · Nivel inicial</strong><p>Acceso a tareas publicadas y verificables.</p><small>Sin depósitos obligatorios.</small></div><section class="card"><h2>Colaboraciones</h2><p class="muted">Las colaboraciones verificadas aparecerán aquí cuando se publiquen.</p></section>';
if(page==='Tareas')h+=records.tasks.length?records.tasks.map(t=>'<section class="card"><div class="row"><strong>'+esc(t.title)+'</strong><span class="tag">'+money(t.reward_cents)+'</span></div><p class="muted">'+esc(t.description||'Tarea disponible')+'</p>'+(records.submissions.some(x=>x.task_id===t.id)?'<small>Estado: '+esc(records.submissions.find(x=>x.task_id===t.id).status)+'</small>':'<button onclick="submitTask('+t.id+')">Enviar tarea para revisión</button>')+'</section>').join(''):'<section class="card">Todavía no hay tareas activas. El administrador debe publicar las primeras.</section>';
if(page==='Retiros')h+='<section class="card"><small>Saldo disponible</small><div class="amount">'+money(available)+'</div><label>Monto a solicitar (S/)<input id="amount" type="number" min="1" step="0.01" placeholder="0.00"></label><button class="wide" onclick="requestWithdrawal()">Solicitar retiro</button><p class="muted">Una solicitud no garantiza el pago. El administrador verificará y registrará la operación.</p></section><h2>Historial</h2>'+(records.withdrawals.map(x=>'<section class="card row"><span>'+money(x.amount_cents)+'<br><small>'+new Date(x.created_at).toLocaleDateString('es-PE')+'</small></span><span class="tag">'+esc(x.status)+'</span></section>').join('')||'<p class="muted">Sin solicitudes.</p>');
if(page==='Retiros')h+='<h2>Movimientos de saldo</h2>'+(records.ledger.map(x=>'<section class="card row"><span><strong>'+esc(x.kind==='earned'?'Recompensa verificada':x.kind==='adjustment'?'Ajuste administrativo':x.kind==='withdrawal'?'Retiro':'Reversión')+'</strong><br><small>'+esc(x.note||'Movimiento registrado')+'</small><br><small>'+new Date(x.created_at).toLocaleString('es-PE')+'</small></span><strong style="color:'+(x.amount_cents>=0?'#79e9c6':'#ff9eaa')+'">'+(x.amount_cents>0?'+':'')+money(x.amount_cents)+'</strong></section>').join('')||'<section class="card">Aún no hay movimientos.</section>');
if(page==='Mi cuenta')h+='<section class="card"><p><strong>'+esc(user.email)+'</strong></p><p class="muted">Cuenta verificada mediante Supabase Auth.</p><button class="secondary wide" onclick="logout()">Cerrar sesión</button></section>';
if(page==='Administración'&&isAdmin)h+='<section class="card"><h2>Panel administrador</h2><p>Usuarios registrados con perfil: '+records.profiles.length+'</p><p>Solicitudes de retiro: '+records.adminWithdrawals.length+'</p></section><h2>Solicitudes de retiro</h2>'+(records.adminWithdrawals.map(x=>'<section class="card"><strong>'+money(x.amount_cents)+'</strong> · '+esc(x.status)+'<p><small>Usuario: '+esc(x.user_id)+'</small></p>'+(x.status==='pending'?'<button onclick="review('+x.id+',\'paid\')">Registrar pago</button> <button class="secondary" onclick="review('+x.id+',\'rejected\')">Rechazar</button>':'')+'</section>').join('')||'<section class="card">No hay solicitudes.</section>');
if(page==='Administración'&&isAdmin){h+='<section class="card"><h2>Publicar tarea</h2><label>Título<input id="taskTitle" maxlength="120"></label><label>Instrucciones<input id="taskDescription" maxlength="1000"></label><label>Recompensa (S/)<input id="taskReward" type="number" min="0.01" step="0.01"></label><button class="wide" onclick="createTask()">Publicar tarea</button></section>';h+='<h2>Tareas publicadas</h2>'+(records.tasks.map(t=>'<section class="card row"><span>'+esc(t.title)+' · '+money(t.reward_cents)+' · '+(t.active?'Activa':'Inactiva')+'</span><button class="secondary" onclick="toggleTask('+t.id+','+(!t.active)+')">'+(t.active?'Desactivar':'Activar')+'</button></section>').join('')||'<p class="muted">Sin tareas.</p>');h+='<h2>Entregas pendientes</h2>'+(records.adminSubmissions.filter(x=>x.status==='pending').map(x=>'<section class="card"><strong>'+esc(records.tasks.find(t=>t.id===x.task_id)?.title||'Tarea #'+x.task_id)+'</strong><p class="muted">Usuario: '+esc(x.user_id)+'</p><button onclick="reviewTask('+x.id+',true)">Aprobar y acreditar</button> <button class="secondary" onclick="reviewTask('+x.id+',false)">Rechazar</button></section>').join('')||'<p class="muted">Sin entregas pendientes.</p>');h+='<section class="card"><h2>Gestión de saldos</h2><p class="muted">Ajustes administrativos registrados en el historial. No son comprobantes de pago.</p><label>Usuario<select id="balanceUser" style="width:100%;background:#15152b;border:1px solid #534c74;color:white;border-radius:10px;padding:12px;margin:7px 0 12px">'+records.profiles.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.display_name||p.id)+'</option>').join('')+'</select></label><label>Operación<select id="balanceDirection" style="width:100%;background:#15152b;border:1px solid #534c74;color:white;border-radius:10px;padding:12px;margin:7px 0 12px"><option value="add">Agregar saldo</option><option value="deduct">Quitar saldo</option></select></label><label>Monto (S/)<input id="balanceAmount" type="number" min="0.01" max="100000" step="0.01" placeholder="0.00"></label><label>Motivo del ajuste<input id="balanceReason" maxlength="500" placeholder="Explica por qué se modifica el saldo"></label><button class="wide" onclick="adjustBalance()">Guardar ajuste de saldo</button></section>';h+='<h2>Usuarios</h2>'+(records.profiles.map(p=>'<section class="card"><small>'+esc(p.id)+'</small> '+esc(p.display_name||'Usuario')+'</section>').join('')||'<p class="muted">Sin usuarios.</p>')}v.innerHTML=h}
async function adjustBalance(){const userId=document.getElementById('balanceUser')?.value,direction=document.getElementById('balanceDirection')?.value,amount=Number(document.getElementById('balanceAmount')?.value),reason=document.getElementById('balanceReason')?.value.trim(),cents=Math.round(amount*100)*(direction==='deduct'?-1:1);if(!userId||!Number.isFinite(amount)||amount<=0||Math.abs(cents)>10000000||reason.length<5)return message('Selecciona un usuario, monto válido y motivo de al menos 5 caracteres.',true);if(!confirm('¿Confirmas '+(cents>0?'AGREGAR ':'QUITAR ')+money(Math.abs(cents))+' al usuario seleccionado? Este movimiento quedará registrado.'))return;const r=await db.rpc('admin_adjust_balance',{p_user_id:userId,p_amount_cents:cents,p_reason:reason});if(r.error)return message(r.error.message,true);await load();message('Ajuste de saldo registrado');render()}
async function createTask(){const title=document.getElementById('taskTitle').value.trim(),description=document.getElementById('taskDescription').value.trim(),reward=Math.round(Number(document.getElementById('taskReward').value)*100);if(!title||!description||!Number.isSafeInteger(reward)||reward<1)return message('Completa título, instrucciones y recompensa válida.',true);const r=await db.rpc('admin_create_task',{p_title:title,p_description:description,p_reward_cents:reward});if(r.error)return message(r.error.message,true);await load();message('Tarea publicada');render()}
async function submitTask(id){if(!confirm('¿Confirmas que completaste la tarea?'))return;const r=await db.rpc('submit_task',{p_task_id:id});if(r.error)return message(r.error.message,true);await load();message('Tarea enviada a revisión');render()}
async function reviewTask(id,approve){if(!confirm(approve?'¿Verificaste la tarea? Se acreditará su recompensa.':'¿Rechazar esta entrega?'))return;const r=await db.rpc('admin_review_task',{p_submission_id:id,p_approve:approve});if(r.error)return message(r.error.message,true);await load();message(approve?'Tarea aprobada y acreditada':'Entrega rechazada');render()}
async function toggleTask(id,active){const r=await db.rpc('admin_toggle_task',{p_task_id:id,p_active:active});if(r.error)return message(r.error.message,true);await load();message('Estado actualizado');render()}
function setAuthMode(mode){authMode=mode;const signup=mode==='signup';const l=document.getElementById('loginTab'),r=document.getElementById('signupTab');if(!l||!r)return;l.classList.toggle('chosen',!signup);r.classList.toggle('chosen',signup);document.getElementById('authTitle').textContent=signup?'Crear una cuenta':'Bienvenido de nuevo';document.getElementById('authSubtitle').textContent=signup?'Regístrate para comenzar':'Ingresa con tu cuenta para continuar';document.getElementById('confirmLabel').style.display=signup?'block':'none';document.getElementById('passwordConfirm').required=signup;document.getElementById('password').autocomplete=signup?'new-password':'current-password';document.getElementById('authSubmit').textContent=signup?'Crear cuenta':'Iniciar sesión';document.getElementById('forgotBtn').style.display=signup?'none':'block'}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const r=await db.auth.signInWithPassword({email,password});if(r.error)return message(r.error.message,true);user=r.data.user;await load();message('Sesión iniciada');render()}
async function register(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return message('Introduce correo y contraseña de al menos 6 caracteres.',true);const confirmation=document.getElementById('passwordConfirm')?.value;if(confirmation!==undefined&&password!==confirmation)return message('Las contraseñas no coinciden.',true);const r=await db.auth.signUp({email,password});if(r.error)return message(r.error.message.toLowerCase().includes('rate limit')?'El servicio de correo alcanzó temporalmente su límite. Espera antes de intentar registrarte de nuevo.':r.error.message,true);message(r.data.session?'Cuenta creada y sesión iniciada.':'Solicitud de registro recibida. Si se requiere confirmación, revisa tu correo.');if(r.data.session){user=r.data.user;await load();render()}}
async function forgotPassword(){const email=document.getElementById('email').value.trim();if(!email)return message('Escribe tu correo electrónico primero.',true);const r=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://ganamas-web.onrender.com'});if(r.error)return message(r.error.message,true);message('Si el correo está registrado, recibirás un enlace para restablecer la contraseña. Revisa también spam.')}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(()=>{const password=prompt('Introduce tu nueva contraseña (mínimo 6 caracteres):');if(!password)return;if(password.length<6){message('La contraseña debe tener al menos 6 caracteres.',true);return}db.auth.updateUser({password}).then(({error})=>{message(error?error.message:'Contraseña actualizada. Ya puedes iniciar sesión.',!!error)})},200)}});
function showActivation(){if(!user){message('Primero crea tu cuenta, confirma el correo e inicia sesión. Luego entra en Mi cuenta para activar el administrador.',true);return}setPage('Mi cuenta')}
async function claimAdmin(){const token=document.getElementById('adminToken')?.value.trim();if(!token)return message('Escribe el código privado de activación.',true);const r=await db.rpc('claim_first_admin',{p_token:token});if(r.error)return message(r.error.message,true);await load();page='Administración';message('Cuenta administradora activada');render()}
async function logout(){await db.auth.signOut();user=null;isAdmin=false;page='Inicio';render()}
async function requestWithdrawal(){const value=Number(document.getElementById('amount').value),cents=Math.round(value*100);if(!Number.isFinite(value)||cents<100)return message('Ingresa un monto válido de al menos S/1.',true);const r=await db.rpc('request_withdrawal',{p_amount_cents:cents});if(r.error)return message(r.error.message,true);await load();message('Solicitud registrada para revisión');render()}
async function review(id,status){let ref=null;if(status==='paid'){ref=prompt('Referencia del pago realmente realizado:');if(!ref||!ref.trim())return}if(!confirm(status==='paid'?'¿Confirmas que el pago se realizó realmente?':'¿Rechazar esta solicitud?'))return;const r=await db.rpc('admin_review_withdrawal',{p_id:id,p_status:status,p_reference:ref});if(r.error)return message(r.error.message,true);await load();message('Solicitud actualizada');render()}
init();
</script></body></html>
